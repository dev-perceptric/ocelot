 to support our clients across the globe. We offer competitive compensation, outstanding health care and retirement benefits, a vibrant and collaborative work environment, and ample opportunities for professional growth.&nbsp;<\/p>\n<p>Join Cadmus. Together, we are strengthening society and the natural world. For more information, visit cadmusgroup.com.<\/p>\n<h2>Responsibilities<\/h2>\n<ul>\n <li>Partner with the design team, engineers, product teams, clients, and other stakeholders to define problems, facilitate workshops, and drive actionable, user-centered product decisions.<\/li>\n <li>Support deep strategic thinking grounded in client and user discovery and research.<\/li>\n <li>Conduct stakeholder interviews, market research, and competitive analysis to identify opportunities and inform product direction.<\/li>\n <li>Thrive working with an agile development process and collaborate closely with cross-functional teams throughout iterative product discovery, design, and delivery cycles.<\/li>\n <li>Create clear research plans, personas, journey maps, and other artifacts that communicate user needs and inform product direction.<\/li>\n <li>Partner with the design team to inform future-state user flows, information architecture, sitemaps, and wireframes.<\/li>\n <li>Plan and facilitate problem definition and co-creation workshops with stakeholders and users alike.<\/li>\n <li>Apply research insights to inform product strategy and prioritize user-centered opportunities.<\/li>\n <li>Document research and testing, including notes, photos, audio, video, and research reports.<\/li>\n <li>Contribute to best practices, documentation, and process workflow improvements, including standardized methodologies, tools, and templates for research deliverables.<\/li>\n<\/ul>\n<h2>Qualifications<\/h2>\n<ul>\n <li>BS/MS in Anthropology, Human-Computer Interaction, Human Factors, Psychology, Sociology, or a related field.<\/li>\n <li>2 or more years of professional UX research experience.<\/li>\n <li>Ability to obtain a Public Trust is required.Excellent communication and storytelling skills, with the ability to synthesize complex research findings and effectively present actionable insights to stakeholders and diverse audiences.<\/li>\n <li>Experience with diverse UX research tools, remote testing tools, and online collaboration tools.<\/li>\n <li>Demonstrated experience planning and executing end-to-end qualitative and quantitative user research, including user interviews, usability testing, surveys, and other research methodologies.<\/li>\n <li>Ability to select appropriate research methods based on project goals, constraints, and research questions to understand user behaviors, motivations, and needs.<\/li>\n <li>Thorough and process minded, with the ability to work independently and manage multiple studies.<\/li>\n <li>Strong interpersonal skills, with the ability to influence decision-making through evidence-based recommendations and strong stakeholder relationships.&nbsp;<\/li>\n<\/ul>\n<p><strong>Nice to Have Skills:<\/strong><\/p>\n<ul>\n <li>Experience supporting federal government, healthcare, or other highly regulated settings.<\/li>\n <li>Comfortable exploring and leveraging user analytics data to identify trends, behaviors, and opportunities that complement qualitative and quantitative research findings.<\/li>\n<\/ul>\n<p><strong>Additional Information:<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>Candidates must be eligible to work in the United States as a U.S Perm Resident or U.S. Citizen.<\/p>\n<p>Based on eligibility and job status, Cadmus offers an excellent benefits package to include: medical, dental, vision, company paid disability and life insurance, 401(k) program, paid time off (PTO), paid holidays, voluntary time off (VTO), tuition reimbursement, adoption assistance program, other optional benefits and various bonus programs.<\/p>\n<p>The salary range for this position is\u202f$95,000 - $110,000. The actual salary will be dete
