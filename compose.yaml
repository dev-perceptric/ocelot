# Ocelot on the VPS (joinocelot.com): the web app behind the server's Traefik, plus the background worker.
# Values come from /opt/ocelot/.env on the server, never from git (docs/setup.md, "6. VPS").
# GitHub Actions copies the code here and runs scripts/deploy-vps.sh on every push to main.
name: ocelot

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the build.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://joinocelot.com}
    image: ocelot-web:latest
    restart: unless-stopped
    env_file: .env
    # The job board sync runs inside the web app, so it gets the same 1 GB it had before.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.ocelot.rule: Host(`joinocelot.com`) || Host(`www.joinocelot.com`)
      traefik.http.routers.ocelot.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.ocelot.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.ocelot.middlewares: ocelot-www
      # www.joinocelot.com sends people to joinocelot.com.
      traefik.http.middlewares.ocelot-www.redirectregex.regex: ^https?://www\.joinocelot\.com/(.*)
      traefik.http.middlewares.ocelot-www.redirectregex.replacement: https://joinocelot.com/$${1}
      traefik.http.middlewares.ocelot-www.redirectregex.permanent: "true"
      traefik.http.services.ocelot.loadbalancer.server.port: "3000"
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ocelot-worker:latest
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    # The worker runs the hourly job as soon as it starts, so it waits for the web app.
    depends_on:
      web:
        condition: service_healthy
    logging: *logs

networks:
  # The network the server's Traefik already watches. Find its name with `docker network ls`.
  proxy:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
