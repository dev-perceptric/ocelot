# Ocelot on the VPS (joinocelot.com): the web app and the background worker. Lives in /docker/ocelot.
# Caddy on the host is the one way in from outside (ops/vps/Caddyfile.ocelot); the web app listens on 127.0.0.1 only.
# The database is Ocelot's own self-hosted Supabase in /docker/sb-ocelot (db.joinocelot.com).
# CI builds both images, loads them onto the server and runs scripts/deploy-vps.sh with TAG set to the commit.
# Runtime values come from /docker/ocelot/.env, never from git (docs/setup.md, "4. The app on the VPS").
name: ocelot

services:
  web:
    image: ocelot-web:${TAG:-latest}
    # Building by hand on the server works too (docker compose build), but CI normally builds the image.
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the build.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://db.joinocelot.com}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://joinocelot.com}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${OCELOT_WEB_PORT:-3400}:3000"
    # The job board sync runs inside the web app, so it gets the same 1 GB it had on Fly.
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: &logs
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  worker:
    image: ocelot-worker:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    # The worker runs the hourly job as soon as it starts, so it waits for the web app.
    depends_on:
      web:
        condition: service_healthy
    logging: *logs
