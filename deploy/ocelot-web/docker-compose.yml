# /docker/ocelot-web on the Hostinger VPS. The site and app at joinocelot.com, routed by the shared Traefik.
# Secrets live in /docker/ocelot-web/.env on the server (see .env.example at the repo root), never in the repo.
# autodeploy pulls :latest every 5 minutes and restarts it when the image changed.
# Like pulsearr-web and arrowsterr-web, this joins no named network.
name: ocelot-web

services:
  web:
    image: ghcr.io/dev-perceptric/ocelot-web:latest
    env_file:
      - .env
    environment:
      # The hourly run (job board sync and alerts) happens on ocelot-jobs, so this copy only serves visitors.
      CRON_DISABLED: "1"
    restart: unless-stopped
    mem_limit: 768m
    # Twice the default CPU weight: when the server is busy, visitors' pages go first.
    cpu_shares: 2048
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 168h
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 5s
    labels:
      - traefik.enable=true
      - traefik.http.routers.ocelot-web.rule=Host(`joinocelot.com`) || Host(`www.joinocelot.com`)
      - traefik.http.routers.ocelot-web.entrypoints=websecure
      - traefik.http.routers.ocelot-web.tls=true
      - traefik.http.routers.ocelot-web.tls.certresolver=letsencrypt
      - traefik.http.routers.ocelot-web.middlewares=ocelot-www
      # www.joinocelot.com sends people to joinocelot.com.
      - traefik.http.middlewares.ocelot-www.redirectregex.regex=^https?://www\.joinocelot\.com/(.*)
      - traefik.http.middlewares.ocelot-www.redirectregex.replacement=https://joinocelot.com/$${1}
      - traefik.http.middlewares.ocelot-www.redirectregex.permanent=true
      - traefik.http.services.ocelot-web.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
