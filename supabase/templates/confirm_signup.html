<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F2F3F4;font-family:Lato,Arial,sans-serif;color:#1A1A1A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F3F4;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#FFFFFF;border:1px solid #D3D5D7;border-radius:8px;">
        <tr><td style="background:#FFE100;padding:20px 32px;border-radius:8px 8px 0 0;font-weight:700;letter-spacing:0.28em;font-size:18px;">OCELOT</td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:24px;line-height:30px;font-weight:700;">Welcome to Ocelot</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px;">Enter this code on the login page to finish signing up. It works for 1 hour.</p>
          <p style="margin:0 0 8px;font-size:14px;line-height:20px;color:#595959;">Your code</p>
          <p style="margin:0 0 24px;font-size:32px;line-height:40px;font-weight:700;letter-spacing:0.2em;">{{ .Token }}</p>
          <p style="margin:0 0 16px;font-size:14px;line-height:20px;color:#595959;">Or open Ocelot on this device:</p>
          
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FFE100;color:#1A1A1A;font-weight:700;font-size:16px;text-decoration:none;padding:14px 24px;border-radius:4px;">Finish signing up</a>
          <p style="margin:32px 0 0;font-size:14px;line-height:20px;color:#595959;">If you didn't ask for this, you can ignore this email.</p>
        </td></tr>
        <tr><td style="padding:16px 32px 24px;font-size:12px;line-height:16px;color:#595959;">Ocelot, joinocelot.com</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
