# Checks on every push and pull request. On main, also builds the app and worker images, loads them onto the VPS over
# SSH and runs scripts/deploy-vps.sh there, which applies new migrations to Ocelot's self-hosted Supabase and restarts
# the containers. Needs the secrets VPS_SSH_KEY and VPS_KNOWN_HOSTS and the variables VPS_HOST and
# NEXT_PUBLIC_SUPABASE_ANON_KEY (docs/setup.md, "7. GitHub"). Without the key, deploys are skipped.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      VPS_DIR: /docker/ocelot
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_SSH_KEY != ''
      - name: Build images
        if: env.VPS_SSH_KEY != ''
        # Built here, not on the server, so a deploy never slows down the other projects on the VPS.
        # The publishable (anon) key is safe to be public; it is built into the pages.
        run: |
          docker build -t "ocelot-web:$TAG" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://db.joinocelot.com' }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://joinocelot.com' }} .
          docker build -t "ocelot-worker:$TAG" -f Dockerfile.worker .
      - name: Load images on the VPS and deploy
        if: env.VPS_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          docker save "ocelot-web:$TAG" "ocelot-worker:$TAG" | gzip | ssh "$VPS_USER@$VPS_HOST" 'gunzip | docker load'
          # Only what the server needs to run. /docker/ocelot/.env lives on the server and is never copied.
          rsync -az --relative compose.yaml scripts/ supabase/migrations/ ops/ "$VPS_USER@$VPS_HOST:$VPS_DIR/"
          ssh "$VPS_USER@$VPS_HOST" "cd $VPS_DIR && TAG=$TAG bash scripts/deploy-vps.sh"
      - name: No VPS key yet
        if: env.VPS_SSH_KEY == ''
        run: echo "::notice::Add the VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets and the VPS_HOST variable to deploy."
