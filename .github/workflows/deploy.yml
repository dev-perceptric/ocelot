# Checks on every push and pull request. On main, also deploys the app and the worker to Fly.io.
# Needs: repository secret FLY_API_TOKEN, and repository variables NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY and NEXT_PUBLIC_SITE_URL (docs/setup.md). Without the token, deploys are skipped.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Database types are up to date
        run: npm run types && git diff --exit-code src/lib/database.types.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ocelot-web
            config: fly.toml
          - app: ocelot-worker
            config: fly.worker.toml
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Create ${{ matrix.app }} if it doesn't exist yet
        if: env.FLY_API_TOKEN != ''
        run: flyctl status --app ${{ matrix.app }} >/dev/null 2>&1 || flyctl apps create ${{ matrix.app }}
      - name: Deploy ${{ matrix.app }}
        if: env.FLY_API_TOKEN != ''
        # --ha=false: one machine per app. Fly starts two on the first deploy otherwise, which doubles the bill.
        run: >-
          flyctl deploy --remote-only --ha=false --config ${{ matrix.config }} --app ${{ matrix.app }}
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://joinocelot.com' }}
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add the FLY_API_TOKEN repository secret to deploy ${{ matrix.app }}."

  migrate:
    # Applies new files in supabase/migrations to the live database. Skipped until the secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Push migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: No Supabase token yet
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and the SUPABASE_PROJECT_REF variable to push migrations."
