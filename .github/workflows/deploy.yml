# Checks on every push and pull request. On main, also deploys the app and the worker to Fly.io.
# Needs: repository secret FLY_API_TOKEN, and repository variables NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY and NEXT_PUBLIC_SITE_URL (docs/setup.md). Without the token, deploys are skipped.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build

  migrate:
    # Applies new files in supabase/migrations to the live database. Skipped until the secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.122.0 # pinned: "latest" asks GitHub and can hit its rate limit
      - name: Push migrations
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: No Supabase token yet
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and the SUPABASE_PROJECT_REF variable to push migrations."

  # Order: migrations, then the web app, then the worker. The worker runs the hourly job as soon as it starts, so it
  # starts only once the new web app is up (a web restart would cut that run short).
  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, migrate]
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Fly's download and API fail now and then: each Fly step gets a second try.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        id: fly1
        if: env.FLY_API_TOKEN != ''
        continue-on-error: true
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != '' && steps.fly1.outcome == 'failure'
      - name: Create ocelot-web if it doesn't exist yet
        if: env.FLY_API_TOKEN != ''
        run: flyctl status --app ocelot-web >/dev/null 2>&1 || flyctl apps create ocelot-web
      - name: Deploy ocelot-web
        if: env.FLY_API_TOKEN != ''
        # --ha=false: one machine per app. Fly starts two on the first deploy otherwise, which doubles the bill.
        run: |
          for try in 1 2 3; do
            flyctl deploy --remote-only --ha=false --config fly.toml --app ocelot-web \
              --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }} \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
              --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://joinocelot.com' }} && exit 0
            echo "::warning::Deploy try $try failed"; sleep $((try * 30))
          done
          exit 1
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add the FLY_API_TOKEN repository secret to deploy ocelot-web."

  deploy-worker:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy-web
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Fly's download and API fail now and then: each Fly step gets a second try.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        id: fly1
        if: env.FLY_API_TOKEN != ''
        continue-on-error: true
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != '' && steps.fly1.outcome == 'failure'
      - name: Create ocelot-worker if it doesn't exist yet
        if: env.FLY_API_TOKEN != ''
        run: flyctl status --app ocelot-worker >/dev/null 2>&1 || flyctl apps create ocelot-worker
      - name: Deploy ocelot-worker
        if: env.FLY_API_TOKEN != ''
        # --ha=false: one machine per app. Fly starts two on the first deploy otherwise, which doubles the bill.
        run: |
          for try in 1 2 3; do
            flyctl deploy --remote-only --ha=false --config fly.worker.toml --app ocelot-worker \
              --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }} \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
              --build-arg NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://joinocelot.com' }} && exit 0
            echo "::warning::Deploy try $try failed"; sleep $((try * 30))
          done
          exit 1
      - name: No Fly token yet
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::Add the FLY_API_TOKEN repository secret to deploy ocelot-worker."
