# The Ocelot site and app on Fly.io (joinocelot.com). Deploys on every push to main (.github/workflows/deploy.yml).
app = "ocelot-web"
primary_region = "sin" # Singapore, next to the Supabase database

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on, so no visitor waits for the app to wake.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
